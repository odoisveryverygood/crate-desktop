name: CrateMac
options:
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NO_DUO_SDK"
targets:
  CrateMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - App/CrateApp.swift
          - App/RootView.swift
          - App/DeviceInfo.swift
          - App/CrowdCam.swift
          - App/Router.swift
          - App/DebugCommands.swift
          - App/PadParamsDebug.swift
          - App/ScreenTracker.swift
          - App/TapTracker.swift
          - UI/Previews.swift
          - '**/*.md'
          - '**/*.sh'
          - '**/Verification'
      - path: Resources/CRATE.icns
      - path: Resources/Fonts
      - path: Resources/AI
      - path: Resources/DefaultKit
        type: folder
      - path: Resources/MacDefaultProjects
        type: folder
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuhan.crate.mac
        PRODUCT_NAME: CRATE
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Mac-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Mac.entitlements
        MARKETING_VERSION: "0.3"
        CURRENT_PROJECT_VERSION: "3"
